<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>COREXPERT — Coming Soon</title>
    <meta name="description" content="COREXPERT. Coming soon." />
    <meta name="theme-color" content="#0b1220" />
    <meta property="og:title" content="COREXPERT" />
    <meta property="og:description" content="Coming soon." />
    <meta property="og:type" content="website" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Ctext x='16' y='22' font-family='Helvetica,Arial,sans-serif' font-size='17' font-weight='700' fill='%23fff' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E"
    />
    <style>
      :root {
        --bg: #0b1220;
        --bg-accent: #101b33;
        --fg: #f1f5f9;
        --muted: #94a3b8;
        --brand: #3b82f6;
        --rule: rgba(148, 163, 184, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background: var(--bg);
        background-image:
          radial-gradient(60rem 40rem at 50% -10%, var(--bg-accent), transparent 70%),
          radial-gradient(40rem 30rem at 90% 110%, rgba(37, 99, 235, 0.14), transparent 70%);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        min-height: 100%;
      }

      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 1.5rem;
      }

      .card {
        width: 100%;
        max-width: 34rem;
        text-align: center;
      }

      .mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 3.25rem;
        height: 3.25rem;
        border-radius: 0.875rem;
        background: linear-gradient(140deg, #3b82f6, #1d4ed8);
        color: #fff;
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 2rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 7vw, 2.75rem);
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .tagline {
        margin: 1.25rem 0 0;
        color: var(--muted);
        font-size: 1.0625rem;
        line-height: 1.65;
      }

      .badge {
        display: inline-block;
        margin-top: 2rem;
        padding: 0.5rem 1rem;
        border: 1px solid var(--rule);
        border-radius: 999px;
        color: var(--fg);
        font-size: 0.8125rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .contact {
        margin: 2.5rem 0 0;
        color: var(--muted);
        font-size: 0.9375rem;
      }

      a {
        color: var(--brand);
        text-decoration: none;
        border-bottom: 1px solid rgba(59, 130, 246, 0.35);
      }

      a:hover,
      a:focus-visible {
        color: #93c5fd;
        border-bottom-color: #93c5fd;
      }

      footer {
        border-top: 1px solid var(--rule);
        padding: 1.5rem;
        text-align: center;
        color: var(--muted);
        font-size: 0.8125rem;
      }

      @media (prefers-reduced-motion: no-preference) {
        .card > * {
          animation: rise 0.6s ease-out both;
        }
        .mark {
          animation-delay: 0.05s;
        }
        h1 {
          animation-delay: 0.12s;
        }
        .tagline {
          animation-delay: 0.19s;
        }
        .badge {
          animation-delay: 0.26s;
        }
        .contact {
          animation-delay: 0.33s;
        }
        @keyframes rise {
          from {
            opacity: 0;
            transform: translateY(0.5rem);
          }
          to {
            opacity: 1;
            transform: none;
          }
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <div class="mark" aria-hidden="true">C</div>
        <h1>COREXPERT</h1>
        <p class="tagline">Our new platform is on its way.</p>
        <span class="badge">Coming soon</span>
        <p class="contact">
          Enquiries:
          <a href="mailto:admin@corexpert.ai">admin@corexpert.ai</a>
        </p>
      </div>
    </main>
    <footer>&copy; 2026 COREXPERT. All rights reserved.</footer>
  </body>
</html>
